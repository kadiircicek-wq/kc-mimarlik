<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eczane 360° Sanal Tur | KC Mimarlık</title>
<link rel="canonical" href="https://kcmimarlik.com/eczane-sanal-tur.html">
<meta name="description" content="KC Mimarlık Eczane projesinin 360° sanal turu: vitrinden reçete bankosuna kadar mekânın içinde dolaşın.">
<link rel="icon" type="image/png" href="favicon-black.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--ink:#0d0d0d;--paper:#f5f5f5;--line:rgba(255,255,255,.16);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:var(--paper);font-family:"Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#c.drag{cursor:grabbing}
#snap{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:0;z-index:2}
.vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0) 18%),linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0) 32%)}
/* hotspots */
#hs{position:fixed;inset:0;pointer-events:none;z-index:4}
.hs{position:absolute;left:0;top:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translate(-50%,-50%);will-change:transform}
.hs .ring{position:relative;width:58px;height:58px;border-radius:50%;border:2px solid #fff;background:rgba(212,175,55,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 6px 22px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .25s,background .25s}
.hs .ring::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--gold);animation:ping 2.2s infinite}
.hs .ring svg{width:22px;height:22px}
.hs .lbl{font-size:13px;font-weight:600;white-space:nowrap;padding:6px 12px;border-radius:99px;background:rgba(13,13,13,.66);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hs:hover .ring{transform:scale(1.12);background:var(--gold)}
.hs:hover .ring svg{stroke:#0d0d0d}
@keyframes ping{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.45);opacity:0}}
/* top */
.top{position:fixed;z-index:6;top:calc(12px + var(--st));left:14px;right:14px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-right:auto;min-width:0}
.logo .badge{width:44px;height:46px;overflow:hidden;position:relative;flex:none}
.logo .badge img{position:absolute;width:90px;height:57px;left:-23.8px;top:-4px;max-width:none}
.logo b{font-family:Fraunces,serif;font-weight:600;font-size:17px;letter-spacing:1px;display:block;line-height:1.1}
.logo small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.pill{flex:none;font-size:12px;font-weight:600;padding:8px 12px;border-radius:99px;background:rgba(13,13,13,.55);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill.warn{color:#f3d77a}
.ib{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(13,13,13,.55);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;text-decoration:none;color:inherit}
.ib:hover{background:var(--gold);color:#0d0d0d}
@media (max-width:640px){.logo>span:last-child{display:none}.pill{font-size:11px;padding:7px 10px}}
/* info + nav */
.info{position:fixed;z-index:5;left:clamp(16px,4vw,44px);bottom:calc(112px + var(--sb));max-width:min(560px,86vw);pointer-events:none}
.info .sec{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700}
.info h1{font-family:Fraunces,serif;font-weight:500;font-size:clamp(32px,5vw,60px);line-height:1;margin:.12em 0 .2em}
.info p{color:rgba(255,255,255,.82);font-size:clamp(13px,1.4vw,15px);line-height:1.55}
.info.swap{animation:fu .7s ease}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.nav{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:0 clamp(10px,3vw,30px) calc(14px + var(--sb));display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;width:104px;height:66px;border-radius:12px;overflow:hidden;position:relative;border:2px solid transparent;opacity:.62;transition:opacity .25s,border-color .25s}
.nav button img{width:100%;height:100%;object-fit:cover}
.nav button span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;font-weight:600;padding:12px 6px 4px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button.on{opacity:1;border-color:var(--gold)}
.nav button:hover{opacity:1}
@media (max-width:640px){.nav button{width:82px;height:54px}.info{bottom:calc(92px + var(--sb))}.hs .ring{width:52px;height:52px}}
.help{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:16px 22px;border-radius:16px;background:rgba(13,13,13,.62);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:14px;line-height:1.75;pointer-events:none;transition:opacity .6s}
.help b{color:var(--gold)}
.help.hide{opacity:0}
.loading{position:fixed;z-index:7;inset:0;display:grid;place-items:center;background:#0d0d0d;font-size:14px;color:#aaa;transition:opacity .6s}
.loading.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="loading" id="loading">Sanal tur yükleniyor…</div>
<canvas id="c"></canvas>
<img id="snap" alt="">
<div class="vig"></div>
<div id="hs"></div>

<header class="top">
  <a class="logo" href="eczane-projesi.html"><span class="badge"><img src="logo.png" alt="KC Mimarlık logo"></span><span><b>KC MİMARLIK</b><small>Eczane · 360° Tur</small></span></a>
  <span class="pill warn" id="status" hidden>Model görüntüsü · render hazırlanıyor</span>
  <a class="ib" href="eczane-projesi.html" aria-label="Turu kapat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</header>

<div class="info" id="info"><div class="sec"></div><h1></h1><p></p></div>
<div class="help" id="help"><b>Sürükle</b> · etrafına bak<br><b>Altın noktaya dokun</b> · o yöne yürü<br><b>Kaydır / iki parmak</b> · yakınlaş</div>
<nav class="nav" id="nav"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== Tur verisi: noktalar ve geçişler SketchUp modelindeki konumlardan hesaplandı ===== */
const NODES = [{"id": "01_dis_cephe", "name": "Dış cephe", "sec": "Sokak", "text": "Apartman zemin katında cam vitrinli eczane; kırmızı E tabelası, saksılar ve aydınlatmalı giriş.", "render": true, "lon0": 0, "hs": [{"to": "02_giris", "l": "İçeri gir", "lon": 0.0, "lat": -11.5}], "limit": {"lon": 52, "lat": 46}}, {"id": "02_giris", "name": "Giriş", "sec": "Satış alanı", "text": "Halka aydınlatmalı dalgalı tavan, kemerli nişli raflar ve ortadaki kampanya masası.", "render": true, "lon0": 0, "hs": [{"to": "03_satis_alani", "l": "Reçete bankosu", "lon": 0.0, "lat": -25.2}, {"to": "04_yan_reyon", "l": "Cilt bakımı reyonu", "lon": -58.2, "lat": -25.1}, {"to": "01_dis_cephe", "l": "Dışarı çık", "lon": 180.0, "lat": -11.2}]}, {"id": "03_satis_alani", "name": "Reçete bankosu", "sec": "Satış alanı", "text": "Yeşil kemerin önünde lamelli meşe reçete bankosu ve yeşil haç.", "render": true, "lon0": 0, "hs": [{"to": "02_giris", "l": "Girişe dön", "lon": 180.0, "lat": -25.2}, {"to": "04_yan_reyon", "l": "Cilt bakımı reyonu", "lon": -118.9, "lat": -25.8}]}, {"id": "04_yan_reyon", "name": "Cilt bakımı reyonu", "sec": "Satış alanı", "text": "Kemerli nişlerde ürün rafları ve Anne & Bebek adası.", "render": true, "lon0": -50, "hs": [{"to": "02_giris", "l": "Giriş", "lon": 121.8, "lat": -25.1}, {"to": "03_satis_alani", "l": "Reçete bankosu", "lon": 61.1, "lat": -25.8}]}];
/* ======================================================================================== */

const canvas=document.getElementById('c'),hsWrap=document.getElementById('hs'),snap=document.getElementById('snap');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(75,1,.1,100);
const loader=new THREE.TextureLoader(),aniso=renderer.capabilities.getMaxAnisotropy();
const D=THREE.MathUtils.degToRad;
let lon=0,lat=0,fov=75,cur=null,group=null,busy=false,token=0;

function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=Math.min(95,fov*(w<h?1.15:1));camera.updateProjectionMatrix()}
addEventListener('resize',size);size();

/* direction for a panorama angle (lon: 0 = image centre, + = right; lat: + = up) */
function dir(lo,la){const phi=D(90-la),th=D(lo+180);return new THREE.Vector3(Math.sin(phi)*Math.cos(th),Math.cos(phi),Math.sin(phi)*Math.sin(th))}

function prep(t){t.encoding=THREE.sRGBEncoding;t.anisotropy=aniso;return t}
function loadTex(u){return new Promise(r=>loader.load(u,t=>r(prep(t)),undefined,()=>r(null)))}

async function build(node){
  const my=++token;const g=new THREE.Group();const base='eczane-tur/'+node.id+'/';
  const pv=await loadTex(base+'p.jpg');if(my!==token)return null;
  const sg=new THREE.SphereGeometry(10,64,40);sg.scale(-1,1,1);
  g.add(new THREE.Mesh(sg,new THREE.MeshBasicMaterial({map:pv})));
  for(let j=0;j<2;j++)for(let i=0;i<4;i++){
    loadTex(`${base}${j}_${i}.jpg`).then(t=>{if(!t||my!==token){t&&t.dispose();return}
      const q=new THREE.SphereGeometry(9.9,40,24,i*Math.PI/2,Math.PI/2,j*Math.PI/2,Math.PI/2);q.scale(-1,1,1);
      g.add(new THREE.Mesh(q,new THREE.MeshBasicMaterial({map:t})))})}
  return g;
}
function dispose(g){if(!g)return;g.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.map&&o.material.map.dispose();o.material.dispose()}});scene.remove(g)}

function hotspots(node){
  hsWrap.innerHTML='';
  node.hs.forEach(h=>{const t=NODES.find(n=>n.id===h.to);if(!t)return;
    const b=document.createElement('button');b.className='hs';
    b.innerHTML=`<span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span><span class="lbl">${h.l}</span>`;
    b._v=dir(h.lon,h.lat);b.addEventListener('pointerdown',e=>e.stopPropagation());
    b.addEventListener('click',e=>{e.stopPropagation();go(t.id,h)});hsWrap.appendChild(b)});
}
const tmp=new THREE.Vector3();
function placeHotspots(){
  for(const b of hsWrap.children){tmp.copy(b._v).applyMatrix4(camera.matrixWorldInverse);
    if(tmp.z>-0.05){b.style.display='none';continue}
    tmp.copy(b._v).project(camera);const x=(tmp.x+1)/2*innerWidth,y=(1-tmp.y)/2*innerHeight;
    b.style.display='';b.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`}
}

function info(node){
  const el=document.getElementById('info');el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap');
  el.querySelector('.sec').textContent=node.sec;el.querySelector('h1').textContent=node.name;el.querySelector('p').textContent=node.text;
  document.getElementById('status').hidden=!!node.render;
  [...document.getElementById('nav').children].forEach(b=>b.classList.toggle('on',b._id===node.id));
  const on=[...document.getElementById('nav').children].find(b=>b._id===node.id);on&&on.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  try{history.replaceState(null,'','#'+node.id.replace(/_/g,'-'))}catch(e){}
}

function tween(ms,f){return new Promise(r=>{const s=performance.now();(function st(n){const t=Math.min(1,(n-s)/ms);f(t*t*(3-2*t));t<1?requestAnimationFrame(st):r()})(s)})}

async function go(id,via){
  if(busy||(cur&&cur.id===id))return;busy=true;
  const node=NODES.find(n=>n.id===id);
  if(cur&&via){ /* turn toward the hotspot, then "walk" into it */
    const l0=lon,a0=lat,dl=((via.lon-l0+540)%360)-180;
    await tween(380,t=>{lon=l0+dl*t;lat=a0+(Math.max(-35,via.lat*.5)-a0)*t});
  }
  if(cur){snap.src=canvas.toDataURL('image/jpeg',.85);snap.style.transition='none';snap.style.opacity=1;snap.style.transform='scale(1)'}
  const g=await build(node);if(!g){busy=false;return}
  dispose(group);group=g;scene.add(g);cur=node;
  lon=node.limit?0:(via?via.lon:node.lon0);lat=node.limit?0:(via?0:(node.lat0||0));fov=75;size();
  hotspots(node);info(node);
  requestAnimationFrame(()=>{snap.style.transition='opacity .75s ease,transform .9s cubic-bezier(.2,.7,.2,1)';snap.style.transform='scale(1.35)';snap.style.opacity=0});
  document.getElementById('loading').classList.add('hide');
  setTimeout(()=>busy=false,500);
}

/* navigation strip */
(function(){const nav=document.getElementById('nav');NODES.forEach(n=>{const b=document.createElement('button');b._id=n.id;
  b.innerHTML=`<img src="eczane-tur/${n.id}/p.jpg" alt=""><span>${n.name}</span>`;b.addEventListener('click',()=>go(n.id));nav.appendChild(b)})})();

/* look around: drag, pinch, wheel, keys */
const pts=new Map();let pinch=null,auto=true;
const help=document.getElementById('help');setTimeout(()=>help.classList.add('hide'),4500);
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.classList.add('drag');auto=false;help.classList.add('hide')});
canvas.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
  if(pts.size===1){const k=camera.fov/innerHeight;lon-=(e.clientX-p.x)*k;lat+=(e.clientY-p.y)*k}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch){fov=Math.max(30,Math.min(95,fov*pinch/d));size()}pinch=d}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)canvas.classList.remove('drag')};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(30,Math.min(95,fov+e.deltaY*.04));size()},{passive:false});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')lon-=6;if(e.key==='ArrowRight')lon+=6;if(e.key==='ArrowUp')lat+=5;if(e.key==='ArrowDown')lat-=5});

function loop(){requestAnimationFrame(loop);if(auto&&!busy&&!(cur&&cur.limit))lon+=.025;lat=Math.max(-85,Math.min(85,lat));
  if(cur&&cur.limit){const hv=camera.fov/2,hh=THREE.MathUtils.radToDeg(Math.atan(Math.tan(D(hv))*camera.aspect));
    const ml=Math.max(0,cur.limit.lon-hh),ma=Math.max(0,cur.limit.lat-hv);lon=Math.max(-ml,Math.min(ml,lon));lat=Math.max(-ma,Math.min(ma,lat))}
  camera.lookAt(dir(lon,lat));renderer.render(scene,camera);placeHotspots()}
loop();

const start=(location.hash||'').slice(1).replace(/-/g,'_');
go(NODES.some(n=>n.id===start)?start:'01_dis_cephe');
</script>
</body>
</html>
