<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Projeler - KC Mimarlık</title>
<style>
:root{--gold:#d4af37;--bg:#0b0b0b;}
*{box-sizing:border-box;margin:0;padding:0;font-family:Georgia, 'Times New Roman', serif;}
body{background:var(--bg);color:#fff;}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 60px;background:#000;}
header .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;}
header .logo-badge{width:62px;height:64px;overflow:hidden;position:relative;background:#fff;border-radius:10px;flex-shrink:0;}
header .logo-img{position:absolute;width:127px;height:80px;left:-33.5px;top:-5.7px;max-width:none;}
header .logo-text{font-size:22px;font-weight:bold;letter-spacing:1px;}
nav a{color:#fff;margin-left:30px;text-decoration:none;font-size:15px;}
nav a.active{color:var(--gold);}
section{padding:80px 60px;}
.section-label{color:var(--gold);letter-spacing:3px;font-size:13px;margin-bottom:10px;text-transform:uppercase;}
h1{font-size:36px;margin-bottom:40px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.card{background:#1a1a1a;height:220px;display:flex;align-items:flex-end;padding:16px;font-size:16px;border-radius:4px;}
footer{padding:40px 60px;background:#000;color:#888;text-align:center;font-size:14px;}
</style>
</head>
<body>
<header>
<a href="index.html" class="logo"><span class="logo-badge"><img src="logo.png" alt="KC Mimarlık logo" class="logo-img"></span><span class="logo-text">KC MİMARLIK</span></a>
<nav>
<a href="index.html">Ana Sayfa</a>
<a href="projeler.html" class="active">Projeler</a>
</nav>
</header>

<section>
<div class="section-label">Portfolyo</div>
<h1>Tüm Projeler</h1>
<div class="grid">
<div class="card">Çekmeköy Villa Projesi</div>
<div class="card">Ataşehir Ofis İç Mekan</div>
<div class="card">Maslak Rezidans</div>
<div class="card">Beykoz Konak Restorasyonu</div>
<div class="card">Sancaktepe Ticari Alan</div>
</div>
</section>

<footer>KC Mimarlık &copy; 2026</footer>
</body>
</html>
